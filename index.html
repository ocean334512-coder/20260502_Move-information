<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="정쉬기 영화관 — 지금 극장에서 상영 중인 영화를 한눈에"
    />
    <title>정쉬기 영화관 — 지금 상영 중</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>

    <header class="header">
      <div class="header__inner">
        <a class="logo" href="#" aria-label="정쉬기 영화관 홈"
          >정쉬기<span class="logo__accent"> 영화관</span></a>
        <nav class="nav">
          <span class="nav__pill">지금 상영</span>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" id="hero">
        <div class="hero__backdrop" id="heroBackdrop"></div>
        <div class="hero__gradient"></div>
        <div class="hero__content">
          <p class="hero__eyebrow">정쉬기 영화관 · 지금 상영</p>
          <h1 class="hero__title" id="heroTitle">불러오는 중…</h1>
          <p class="hero__overview" id="heroOverview"></p>
        </div>
      </section>

      <section class="catalog">
        <div class="catalog__head">
          <h2 class="catalog__title">지금 상영 중</h2>
          <p class="catalog__sub">극장에서 만나는 최신 라인업</p>
        </div>

        <div class="catalog__status" id="status" role="status"></div>

        <div class="grid" id="movieGrid" aria-live="polite"></div>
      </section>
    </main>

    <footer class="footer">
      <p>정쉬기 영화관 · 데이터 제공 The Movie Database (TMDB)</p>
    </footer>

    <script src="assets/runtime-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
